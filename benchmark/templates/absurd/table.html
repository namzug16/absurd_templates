<x-props users="List<({String name, String email, String bio, bool admin})>"></x-props>

<table>
  <x-for in="users" as="user" indexed="1" index-as="number">
    <tr>
      <td>{{ number }}</td>
      <td>{{ user.name }}</td>
      <td>{{ user.email }}</td>
      <x-if case="user.admin">
        <td>admin</td>
      </x-if>
    </tr>
  </x-for>
</table>
