<x-props
  title="String"
  users="List<({String name, bool active})>"
  footer="Fragment?"
></x-props>

<section>
  <h1>{{ title }}</h1>
  <ul>
    <x-for in="users" as="user" indexed="1" index-as="number">
      <x-if case="user.active">
        <x-fragment _="/ui/user-item.html" number="{{ number }}" name="{{ user.name }}" />
      </x-if>
    </x-for>
  </ul>
  {{ footer }}
</section>
